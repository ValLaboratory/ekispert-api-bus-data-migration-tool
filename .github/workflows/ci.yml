name: CI

# Lint・テスト（pytest）を実行し、タグ push 時は GitHub Releases を作成する。
# 本ツールはリポジトリを展開してそのまま実行する使い方のため、配布物は
# GitHub が自動で添付する Source code（zip / tar.gz）のみとする。

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint・フォーマット
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
            python: "3.12"
          - name: macOS
            runner: macos-15
            python: "3.12"
          - name: Linux
            runner: ubuntu-24.04
            python: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: テスト（pytest）
        run: pytest -q

  release:
    name: Release 作成
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: GitHub Release を作成
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
