[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ekispert-api-bus-data-migration-tool"
dynamic = ["version"]
description = "バスデータ移行ツール（駅すぱあと API）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
ekispert-bus-data-migration = "ekispert_bus_data_migration.cli:main"

[tool.setuptools.packages.find]
include = ["ekispert_bus_data_migration*"]

[tool.setuptools.dynamic]
version = { attr = "ekispert_bus_data_migration.version.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
# requires-python と揃える。3.12以降でしか動かない構文をリントで検出するため。
target-version = "py311"

[tool.ruff.lint]
ignore = ["UP031", "BLE001"]
